<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidate Form | RPMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-shell">

        <aside class="sidebar">

            <!-- Kiran Academy Logo -->
            <a class="brand" href="dashboard.html">
                <img
                    src="images/kiran-academy-logo.png"
                    alt="Kiran Academy Logo"
                    class="brand-logo"
                >
            </a>

            <!-- Sidebar Navigation -->
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="candidates.html">Candidates</a>
                <a href="companies.html">Companies</a>
                <a href="jobs.html">Jobs</a>
                <a href="applications.html">Applications</a>
                <a href="interviews.html">Interviews</a>
                <a href="placement-process.html">Placement Process</a>
                <a href="reports.html">Reports</a>
            </nav>

            <div class="sidebar-foot">
                Kiran Academy
                <br>
                <small>Recruitment & Placement</small>
            </div>

        </aside>

        <main class="main-area">

            <!-- Top Header -->
            <header class="topbar">

                <button id="menuToggle" class="icon-btn">☰</button>

                <span>
                    Recruitment & Placement Management System
                </span>

                <div class="user-menu">
                    <span id="currentUser">Authorized User</span>

                    <button id="logoutBtn" class="btn secondary small">
                        Logout
                    </button>
                </div>

            </header>

            <!-- Page Content -->
            <div class="page-content">

                <div class="page-heading">
                    <div>
                        <p class="eyebrow">PEOPLE</p>

                        <h1>Add Candidate</h1>

                        <p class="muted">
                            Enter candidate personal, academic and placement details.
                        </p>
                    </div>
                </div>

                <!-- Candidate Registration Form -->
                <form id="candidateForm" class="panel form-grid">

                    <label>
                        Full Name
                        <input name="full_name" required>
                    </label>

                    <label>
                        Email
                        <input name="email" type="email" required>
                    </label>

                    <label>
                        Mobile
                        <input name="mobile" required>
                    </label>

                    <label>
                        Date of Birth
                        <input name="date_of_birth" type="date">
                    </label>

                    <label>
                        Gender
                        <select name="gender">
                            <option value="">Select</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </label>

                    <label>
                        Qualification
                        <input name="qualification" required placeholder="B.Tech">
                    </label>

                    <label>
                        College
                        <input name="college">
                    </label>

                    <label>
                        University
                        <input name="university">
                    </label>

                    <label>
                        Passing Year
                        <input
                            name="passing_year"
                            type="number"
                            min="1990"
                            max="2100"
                            required
                        >
                    </label>

                    <label>
                        Percentage
                        <input
                            name="percentage"
                            type="number"
                            min="0"
                            max="100"
                            step=".01"
                        >
                    </label>

                    <label>
                        CGPA
                        <input
                            name="cgpa"
                            type="number"
                            min="0"
                            max="10"
                            step=".01"
                        >
                    </label>

                    <label>
                        Backlog Count
                        <input
                            name="backlog_count"
                            type="number"
                            min="0"
                            value="0"
                        >
                    </label>

                    <label>
                        Primary Technology
                        <input name="primary_technology">
                    </label>

                    <label>
                        Secondary Skills
                        <input
                            name="secondary_skills"
                            placeholder="SQL, HTML, CSS"
                        >
                    </label>

                    <label>
                        Skill Level
                        <select name="skill_level">
                            <option>BEGINNER</option>
                            <option selected>INTERMEDIATE</option>
                            <option>ADVANCED</option>
                        </select>
                    </label>

                    <label>
                        Current Location
                        <input name="current_location">
                    </label>

                    <label>
                        Preferred Location
                        <input name="preferred_location">
                    </label>

                    <label>
                        Profile Status
                        <select name="profile_status">
                            <option>ACTIVE</option>
                            <option>ON_HOLD</option>
                            <option>INACTIVE</option>
                        </select>
                    </label>

                    <!-- Form Actions -->
                    <div class="form-actions full">

                        <button class="btn primary">
                            Save Candidate
                        </button>

                        <a class="btn secondary" href="candidates.html">
                            Cancel
                        </a>

                    </div>

                    <div id="message" class="message full"></div>

                </form>

            </div>

        </main>

    </div>

    <!-- JavaScript Files -->
    <script src="js/main.js"></script>
    <script src="js/validation.js"></script>

</body>
</html>
